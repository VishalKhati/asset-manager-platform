global:
  scrape_interval: 30s
scrape_configs:
  - job_name: api
    metrics_path: /api/metrics
    authorization: { credentials_file: /etc/prometheus/metrics_token }
    static_configs: [{ targets: ["api:8080"] }]
  - job_name: engine
    authorization: { credentials_file: /etc/prometheus/metrics_token }
    static_configs: [{ targets: ["engine:9464"] }]
