# Supply-chain guard: a package version must have been published for at least a day
# before pnpm installs it (most malicious releases are pulled within hours).
minimumReleaseAge: 1440

packages:
  - artifacts/*
  - lib/*

catalog:
  '@tailwindcss/vite': ^4.1.14
  '@types/node': ^25.3.3
  drizzle-orm: ^0.45.2
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.2
  zod: ^3.25.76

autoInstallPeers: false

onlyBuiltDependencies:
  - esbuild

overrides:
  # drizzle-kit pulls an old, vulnerable esbuild through @esbuild-kit; route it to tsx instead.
  "@esbuild-kit/esm-loader": "npm:tsx@^4.21.0"
  esbuild: "0.27.3"
